<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARMAN Solutions — Owner Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">
    <div class="logo-icon"><span class="logo-b">B</span></div>
    <div class="logo-text-wrap">
      <span class="logo-main">BARMAN</span>
      <span class="logo-sub">SOLUTIONS</span>
    </div>
    <div class="logo-badge">✔ OWNER</div>
  </div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Gallery</a>
    <a href="#" class="nav-link" onclick="logout()">Logout</a>
  </div>
</nav>

<div class="dashboard-page">

  <div class="dash-title">🛡️ Owner Dashboard</div>

  <!-- STATS (clickable filters) -->
  <div class="dash-stats">
    <div class="dash-stat dash-stat-clickable active" data-device-filter="All" onclick="setDashDeviceFilter('All', this)">
      <div class="dash-stat-val" id="stat-total">0</div>
      <div class="dash-stat-label">All Wallpapers</div>
    </div>
    <div class="dash-stat dash-stat-clickable" data-device-filter="PC" onclick="setDashDeviceFilter('PC', this)">
      <div class="dash-stat-val" id="stat-pc">0</div>
      <div class="dash-stat-label">💻 PC</div>
    </div>
    <div class="dash-stat dash-stat-clickable" data-device-filter="Phone" onclick="setDashDeviceFilter('Phone', this)">
      <div class="dash-stat-val" id="stat-phone">0</div>
      <div class="dash-stat-label">📱 Phone</div>
    </div>
    <div class="dash-stat">
      <div class="dash-stat-val">BARMAN</div>
      <div class="dash-stat-label">Owner</div>
    </div>
  </div>

  <!-- UPLOAD -->
  <div class="upload-card">
    <h3>⬆️ Upload New Wallpaper</h3>

    <div id="dash-upload-preview" style="display:none;margin-bottom:14px">
      <img id="dash-upload-img" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px;border:1px solid rgba(212,175,55,0.3)">
    </div>

    <div class="upload-fields">
      <input type="text" id="title" placeholder="Wallpaper title">
      <select id="category">
        <option value="Nature">🌿 Nature</option>
        <option value="City">🏙️ City</option>
        <option value="Space">🌌 Space</option>
        <option value="Abstract">🔮 Abstract</option>
        <option value="Dark">🌑 Dark</option>
        <option value="Anime">✨ Anime</option>
        <option value="Cars">🚗 Cars</option>
        <option value="Technology">💻 Technology</option>
      </select>
      <select id="device">
        <option value="PC">💻 PC (Landscape)</option>
        <option value="Phone">📱 Phone (Portrait)</option>
      </select>
      <label class="file-label">
        <input type="file" id="image" accept="image/*" onchange="previewDashUpload()">
        <span id="file-name">Choose image...</span>
      </label>
      <button class="upload-btn" onclick="uploadWallpaper()">⬆️ Publish</button>
    </div>
    <div id="upload-msg" style="margin-top:12px;font-size:13px;color:#888"></div>
  </div>

  <!-- TABLE (with Device column) -->
  <div class="dash-table-wrap">
    <table class="dash-table">
      <thead>
        <tr>
          <th>Preview</th>
          <th>Title</th>
          <th>Category</th>
          <th>Device</th>
          <th>Uploaded</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="dash-tbody">
        <tr><td colspan="6" style="text-align:center;padding:30px;color:#555">Loading...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script src="dashboard.js"></script>
</body>
</html>
