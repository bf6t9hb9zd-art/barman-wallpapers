<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARMAN Owner Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🔥 BARMAN OWNER DASHBOARD</h1>
    <p>Full Control Panel</p>
</header>

<section class="upload-section">

    <h2>Upload Wallpaper</h2>

    <input type="text" id="title" placeholder="Wallpaper Title">

    <!-- NEW CATEGORY DROPDOWN -->
    <select id="category">
        <option value="Cars">🚗 Cars</option>
        <option value="Anime">🎌 Anime</option>
        <option value="Gaming">🎮 Gaming</option>
        <option value="Nature">🌿 Nature</option>
        <option value="Sports">⚽ Sports</option>
    </select>

    <input type="file" id="image">

    <button onclick="uploadWallpaper()">
        Upload Wallpaper
    </button>

</section>

<section class="stats">
    <h2>Total Wallpapers: <span id="count">0</span></h2>
</section>

<section class="gallery" id="adminGallery"></section>

<script src="dashboard.js"></script>

</body>
</html>
