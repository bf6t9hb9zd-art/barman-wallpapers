<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BARMAN Wallpapers</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <div class="logo-section">
   <img src="logo.png" alt="BARMAN Wallpapers Logo" class="logo">

    <div class="hero-content">
      <h1>BARMAN Wallpapers</h1>
      <p>Premium Wallpapers • Unlimited Downloads</p>
    </div>
    <span class="verified-badge">✔ VERIFIED OWNER</span>
  </div>

  <p class="subtitle">Powered by BARMAN Solutions PTY LTD</p>

  <input type="text" id="searchInput" placeholder="Search wallpapers...">
</header>



<section class="upload-box">
  <input type="text" id="title" placeholder="Wallpaper title">
  <input type="file" id="image">
  <button onclick="uploadWallpaper()">Upload</button>
</section>

<section class="gallery" id="gallery"></section>

<script src="script.js"></script>
</body>
</html>
