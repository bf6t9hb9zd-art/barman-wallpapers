<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARMAN Solutions — Owner Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">
    <div class="logo-icon"><span class="logo-b">B</span></div>
    <div class="logo-text-wrap">
      <span class="logo-main">BARMAN</span>
      <span class="logo-sub">SOLUTIONS</span>
    </div>
    <div class="logo-badge">✔ VERIFIED</div>
  </div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Gallery</a>
  </div>
</nav>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="logo-icon"><span class="logo-b">B</span></div>
      <div class="logo-text-wrap">
        <span class="logo-main">BARMAN</span>
        <span class="logo-sub">SOLUTIONS</span>
      </div>
    </div>
    <h2>Owner Login</h2>
    <p>Access your admin dashboard</p>
    <input type="text" id="username" placeholder="Username" autocomplete="off">
    <input type="password" id="password" placeholder="Password">
    <button class="login-btn" id="loginBtn">Login</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<script>
async function performLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const errEl = document.getElementById("login-error");
    const btn = document.getElementById("loginBtn");

    if (!username || !password) {
        errEl.textContent = "Please enter both username and password.";
        errEl.style.color = "#ff4d4d";
        return;
    }

    btn.textContent = "Authenticating...";
    btn.disabled = true;

    try {
        const res = await fetch("https://barman-wallpapers.onrender.com/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
            localStorage.setItem("admin", "true");
            localStorage.setItem("adminName", username.toUpperCase());
            window.location.href = "dashboard.html";
        } else {
            throw new Error(data.message || "Invalid credentials");
        }
    } catch (err) {
        errEl.textContent = err.message === "Failed to fetch" 
            ? "Server is waking up. Please wait 30s and try again." 
            : err.message;
        btn.textContent = "Login";
        btn.disabled = false;
    }
}

document.getElementById("loginBtn").addEventListener("click", performLogin);

document.addEventListener("keydown", e => {
    if (e.key === "Enter") performLogin();
});
</script>

</body>
</html>
