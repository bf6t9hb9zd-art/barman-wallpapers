<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARMAN Solutions — Owner Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-logo">
    <div class="logo-icon"><span class="logo-b">B</span></div>
    <div class="logo-text-wrap">
      <span class="logo-main">BARMAN</span>
      <span class="logo-sub">SOLUTIONS</span>
    </div>
    <div class="logo-badge" data-i18n="login.badge">✔ VERIFIED</div>
  </div>
  <div class="nav-links">
    <a href="index.html" class="nav-link" data-i18n="nav.gallery">Gallery</a>
  </div>
</nav>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="logo-icon"><span class="logo-b">B</span></div>
      <div class="logo-text-wrap">
        <span class="logo-main">BARMAN</span>
        <span class="logo-sub">SOLUTIONS</span>
      </div>
    </div>
    <h2 data-i18n="login.title">Owner Login</h2>
    <p data-i18n="login.desc">Access your admin dashboard</p>
    <input type="text" id="username" data-i18n-placeholder="login.username" autocomplete="off">
    <input type="password" id="password" data-i18n-placeholder="login.password">
    <button class="login-btn" id="loginBtn" data-i18n="login.btn">Login</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<script src="i18n.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    applyTranslations();
});

document.getElementById("loginBtn").addEventListener("click", async function () {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const errEl = document.getElementById("login-error");
    const btn = document.getElementById("loginBtn");

    btn.textContent = t('login.btn.loading');
    btn.disabled = true;

    try {
        const res = await fetch("https://barman-wallpapers.onrender.com/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
            localStorage.setItem("admin", "true");
            window.location.href = "dashboard.html";
        } else {
            errEl.textContent = data.message || t('login.error.creds');
            btn.textContent = t('login.btn');
            btn.disabled = false;
        }
    } catch (err) {
        errEl.textContent = t('login.error.server');
        btn.textContent = t('login.btn');
        btn.disabled = false;
    }
});

document.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
});
</script>

</body>
</html>
